<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MLS Sidecar</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      background-color: #f9fafb;
      margin: 0;
    }
    h2 { font-size: 1.25rem; color: #111827; }
    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
      border-radius: 9999px;
      background-color: #d1fae5;
      color: #065f46;
      margin-bottom: 1rem;
    }
    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 0.5rem;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .field-label { font-size: 0.875rem; color: #6b7280; margin-bottom: 0.25rem; }
    .field-value { font-size: 1rem; color: #111827; font-weight: 500; }
    button {
      width: 100%;
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 0.75rem;
      border-radius: 0.375rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
    }
    button:hover { background-color: #1d4ed8; }
    .secondary-btn {
      background-color: white;
      color: #374151;
      border: 1px solid #d1d5db;
      margin-top: 0.5rem;
    }
    .secondary-btn:hover { background-color: #f3f4f6; }
  </style>
</head>
<body>
  <h2>MLS Workflow Sidecar</h2>
  <div class="status-badge">Path B: Extension Active</div>

  <div class="card" id="listing-info">
    <div class="field-label">Current Address</div>
    <div class="field-value" id="address">123 Main St, Grand Rapids, MI</div>
  </div>

  <button id="fill-btn">Stage MLS Fill</button>
  <button id="media-btn" class="secondary-btn">Sync Photos (50)</button>

  <script src="sidecar.js"></script>
</body>
</html>
